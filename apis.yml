name: Umony
description: >-
  Umony is a London-based communications compliance platform, founded in 2017
  and backed by Seedcamp, that captures, records, and archives employee voice
  calls, SMS, WhatsApp, and Microsoft Teams conversations at the
  telecom-network level for banks and other regulated financial institutions.
  Its platform spans the Umony App (BYOD softphone), Umony Mobile (eSIM
  carrier-level capture), and Umony Archive with AI risk scoring, and the
  company holds BSI-certified ISO 27001:2022, ISO 42001:2023, and ISO
  22301:2019 certifications. Umony publishes no public developer API surface
  today.
